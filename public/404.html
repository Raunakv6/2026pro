<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting... | Raunak Shrestha Portfolio</title>
    <script>
      // Automatically redirect back to the home page of the portfolio
      window.location.replace('/');
    </script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #020617;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
      }
      .card {
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(242, 125, 38, 0.3);
        border-radius: 1rem;
        padding: 2.5rem 2rem;
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 30px rgba(242, 125, 38, 0.15);
      }
      .glitch {
        font-size: 3.5rem;
        font-weight: 900;
        letter-spacing: 0.1em;
        color: #f27d26;
        margin-bottom: 0.5rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 1rem;
        color: #ffffff;
      }
      p {
        font-size: 0.95rem;
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 1.75rem;
      }
      .btn {
        display: inline-block;
        background: #f27d26;
        color: #020617;
        font-weight: 700;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        padding: 0.75rem 1.75rem;
        border-radius: 0.5rem;
        text-decoration: none;
        transition: transform 0.2s, background 0.2s;
      }
      .btn:hover {
        background: #ff8e3d;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glitch">404</div>
      <h1>System Redirect</h1>
      <p>Redirecting you to the home portfolio interface...</p>
      <a href="/" class="btn">Return to Portfolio</a>
    </div>
  </body>
</html>
